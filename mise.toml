[env]
# Error instead of downloading a newer Go when a go.mod's go line is ahead of the Go in use.
GOTOOLCHAIN = "local"

[tools]
go = "1.27.4"
jq = "1.8.2"
ffmpeg = "9.0.2" # tests only: builds fixtures for the real-binary tests
golangci-lint = "2.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

[task_config]
# Git's sh: Windows' default is cmd, and PowerShell's `bash` is WSL's. -e stops at the first failure.
shell = "sh -ec"

[tasks.build]
description = "Build each module to dist/<module>.exe"
usage = 'arg "[module]..." help="Modules to build; all by default"'
run = 'for m in ${usage_module:-$(dirname */go.mod)}; do echo "# $m"; (cd "$m" && go build -o "../dist/$m.exe" .); done'

[tasks.test]
description = "go test each module"
usage = 'arg "[module]..." help="Modules to test; all by default"'
run = 'for m in ${usage_module:-$(dirname */go.mod)}; do echo "# $m"; (cd "$m" && go test ./...); done'

[tasks.vet]
description = "go vet, go mod tidy -diff, golangci-lint run and fmt --diff for each module"
usage = 'arg "[module]..." help="Modules to vet; all by default"'
run = '''
for m in ${usage_module:-$(dirname */go.mod)}; do
  echo "# $m"
  (cd "$m" && go vet ./... && go mod tidy -diff && golangci-lint run ./... && golangci-lint fmt --diff ./...)
done
'''

[tasks.vet-linux]
description = "Type-check and lint each module's non-Windows stubs"
usage = 'arg "[module]..." help="Modules to vet; all by default"'
run = 'for m in ${usage_module:-$(dirname */go.mod)}; do echo "# $m"; (cd "$m" && GOOS=linux go vet ./... && GOOS=linux golangci-lint run ./...); done'

[tasks.vuln]
description = "govulncheck each module (needs network)"
usage = 'arg "[module]..." help="Modules to scan; all by default"'
run = 'for m in ${usage_module:-$(dirname */go.mod)}; do echo "# $m"; (cd "$m" && govulncheck ./...); done'

[tasks.clean]
description = "Delete dist/"
run = "rm -rf dist"

# Plex has no download URL for the spec; it's embedded in the Redoc page as __redoc_state.
# jq -e fails on no match, so a page layout change errors instead of emptying openapi.json.
[tasks.openapi]
description = "Refresh openapi.json from the Plex docs page (needs curl and network)"
run = '''
curl -fsSL https://developer.plex.tv/pms/ \
  | sed -n 's/^[[:space:]]*const __redoc_state = \(.*\);[[:space:]]*$/\1/p' \
  | jq -en 'input | .spec.data | select(.openapi and (.paths | length) > 0)' > openapi.json.tmp \
  || { rm -f openapi.json.tmp; echo "openapi: no spec found on developer.plex.tv/pms/" >&2; exit 1; }
mv openapi.json.tmp openapi.json
'''
