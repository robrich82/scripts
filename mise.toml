[env]
# Error instead of downloading a newer Go when a go.mod's go line is ahead of the Go in use.
GOTOOLCHAIN = "local"
POWERSHELL_TELEMETRY_OPTOUT = "1"

[settings]
# Lock Linux and macOS too, not just the platform that last ran `mise lock`.
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64", "windows-x64"]

# The first of these on the machine installs each unprefixed [bootstrap.packages] key: the distro's
# own manager, then Homebrew, MacPorts, Nix; on Windows Chocolatey or Scoop when installed, else winget.
system_packages.prefer = ["apt", "dnf", "pacman", "zypper", "apk", "brew", "macports", "nix", "choco", "scoop", "winget"]

# What the built tools run. `mise bootstrap packages apply` installs what's missing; `mise install`
# only hints. A manager missing from `names` installs the key's own name.
[bootstrap.packages]
mkvtoolnix = { names = { winget = "MoritzBunkus.MKVToolNix", scoop = "extras/mkvtoolnix", pacman = "mkvtoolnix-cli", nix = "mkvtoolnix-cli" } }
# Must be ImageMagick 7: cbz-fix runs `magick`, which 6 lacks.
imagemagick = { names = { winget = "ImageMagick.ImageMagick", macports = "ImageMagick7", dnf = "ImageMagick", zypper = "ImageMagick" } }
exiftool = { names = { winget = "OliverBetz.ExifTool", apt = "libimage-exiftool-perl", pacman = "perl-image-exiftool", dnf = "perl-Image-ExifTool" } }

[tools]
go = "1.27.4"
jq = "1.8.2"
ffmpeg = "9.0.2" # tests only: builds fixtures for the real-binary tests
golangci-lint = "2.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.10.0"

# Tasks run tasks/<name>.sh under sh on macOS and Linux, and tasks/<name>.ps1 under pwsh 7.4+ on
# Windows (from cmd, mise's Windows shell), so they work from any shell. Change both together.
# Module tasks take module directory names (`mise run test mkv-movie`) and default to every
# top-level directory with a go.mod.

[tasks.build]
description = "Build each module to dist/<module> (.exe on Windows)"
usage = 'arg "[module]..." help="Modules to build; all by default"'
run = "sh tasks/build.sh"
run_windows = "pwsh -NoProfile -ExecutionPolicy Bypass -File tasks/build.ps1"

[tasks.test]
description = "go test each module"
usage = 'arg "[module]..." help="Modules to test; all by default"'
run = "sh tasks/test.sh"
run_windows = "pwsh -NoProfile -ExecutionPolicy Bypass -File tasks/test.ps1"

[tasks.vet]
description = "go vet, go mod tidy -diff, golangci-lint run and fmt --diff for each module"
usage = 'arg "[module]..." help="Modules to vet; all by default"'
run = "sh tasks/vet.sh"
run_windows = "pwsh -NoProfile -ExecutionPolicy Bypass -File tasks/vet.ps1"

# No fmt: it ignores build tags, so vet's run already covers the stubs.
[tasks.vet-linux]
description = "Type-check and lint each module's non-Windows stubs"
usage = 'arg "[module]..." help="Modules to vet; all by default"'
run = "sh tasks/vet-linux.sh"
run_windows = "pwsh -NoProfile -ExecutionPolicy Bypass -File tasks/vet-linux.ps1"

[tasks.vuln]
description = "govulncheck each module (needs network)"
usage = 'arg "[module]..." help="Modules to scan; all by default"'
run = "sh tasks/vuln.sh"
run_windows = "pwsh -NoProfile -ExecutionPolicy Bypass -File tasks/vuln.ps1"

[tasks.clean]
description = "Delete dist/"
run = "sh tasks/clean.sh"
run_windows = "pwsh -NoProfile -ExecutionPolicy Bypass -File tasks/clean.ps1"

[tasks.openapi]
description = "Refresh openapi.json from the Plex docs page (needs network)"
run = "sh tasks/openapi.sh"
run_windows = "pwsh -NoProfile -ExecutionPolicy Bypass -File tasks/openapi.ps1"

# Fetched on demand by the tmdb-api skill, so gitignored. Examples are 90% of the 3 MB spec.
[tasks.tmdb-openapi]
description = "Fetch tmdb-openapi.json, the TMDB API spec without its examples (needs network)"
run = "sh tasks/tmdb-openapi.sh"
run_windows = "pwsh -NoProfile -ExecutionPolicy Bypass -File tasks/tmdb-openapi.ps1"
