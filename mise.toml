[env]
# Error instead of downloading a newer Go when a go.mod's go line is ahead of the Go in use.
GOTOOLCHAIN = "local"
POWERSHELL_TELEMETRY_OPTOUT = "1"

[tools]
go = "1.27.4"
jq = "1.8.2"
ffmpeg = "9.0.2" # tests only: builds fixtures for the real-binary tests
golangci-lint = "2.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

# Module tasks take module directory names (`mise run test mkv-movie`) and default to every
# top-level directory with a go.mod.
[task_config]
# Runs the same from PowerShell, Git Bash and CI; Windows' default is cmd.
# Every task but clean starts with a line that stops it on any failing command (needs pwsh 7.4+).
shell = "pwsh -NoProfile -Command"

[tasks.build]
description = "Build each module to dist/<module>.exe"
usage = 'arg "[module]..." help="Modules to build; all by default"'
run = '''
$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; if ($PSVersionTable.PSVersion -lt '7.4') { throw 'needs PowerShell 7.4+' }
$mods = if ($env:usage_module) { -split $env:usage_module } else { (Get-ChildItem -Directory | Where-Object { $_.Name -notlike '.*' -and (Test-Path -LiteralPath "$_/go.mod") }).Name }
if (-not $mods) { throw 'no modules found' }
foreach ($m in $mods) {
  $m = $m.Trim(".\/'".ToCharArray()); if (-not $m) { throw 'empty module name' }; "# $m"
  Push-Location -LiteralPath $m; try { go build -o "../dist/$m.exe" . } finally { Pop-Location }
}
'''

[tasks.test]
description = "go test each module"
usage = 'arg "[module]..." help="Modules to test; all by default"'
run = '''
$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; if ($PSVersionTable.PSVersion -lt '7.4') { throw 'needs PowerShell 7.4+' }
$mods = if ($env:usage_module) { -split $env:usage_module } else { (Get-ChildItem -Directory | Where-Object { $_.Name -notlike '.*' -and (Test-Path -LiteralPath "$_/go.mod") }).Name }
if (-not $mods) { throw 'no modules found' }
foreach ($m in $mods) {
  $m = $m.Trim(".\/'".ToCharArray()); if (-not $m) { throw 'empty module name' }; "# $m"
  Push-Location -LiteralPath $m; try { go test ./... } finally { Pop-Location }
}
'''

[tasks.vet]
description = "go vet, go mod tidy -diff, golangci-lint run and fmt --diff for each module"
usage = 'arg "[module]..." help="Modules to vet; all by default"'
run = '''
$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; if ($PSVersionTable.PSVersion -lt '7.4') { throw 'needs PowerShell 7.4+' }
$mods = if ($env:usage_module) { -split $env:usage_module } else { (Get-ChildItem -Directory | Where-Object { $_.Name -notlike '.*' -and (Test-Path -LiteralPath "$_/go.mod") }).Name }
if (-not $mods) { throw 'no modules found' }
foreach ($m in $mods) {
  $m = $m.Trim(".\/'".ToCharArray()); if (-not $m) { throw 'empty module name' }; "# $m"
  Push-Location -LiteralPath $m
  try { go vet ./...; go mod tidy -diff; golangci-lint run ./...; golangci-lint fmt --diff ./... } finally { Pop-Location }
}
'''

# No fmt: it ignores build tags, so vet's run already covers the stubs.
[tasks.vet-linux]
description = "Type-check and lint each module's non-Windows stubs"
usage = 'arg "[module]..." help="Modules to vet; all by default"'
run = '''
$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; if ($PSVersionTable.PSVersion -lt '7.4') { throw 'needs PowerShell 7.4+' }
$env:GOOS = 'linux'
$mods = if ($env:usage_module) { -split $env:usage_module } else { (Get-ChildItem -Directory | Where-Object { $_.Name -notlike '.*' -and (Test-Path -LiteralPath "$_/go.mod") }).Name }
if (-not $mods) { throw 'no modules found' }
foreach ($m in $mods) {
  $m = $m.Trim(".\/'".ToCharArray()); if (-not $m) { throw 'empty module name' }; "# $m"
  Push-Location -LiteralPath $m; try { go vet ./...; golangci-lint run ./... } finally { Pop-Location }
}
'''

[tasks.vuln]
description = "govulncheck each module (needs network)"
usage = 'arg "[module]..." help="Modules to scan; all by default"'
run = '''
$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; if ($PSVersionTable.PSVersion -lt '7.4') { throw 'needs PowerShell 7.4+' }
$mods = if ($env:usage_module) { -split $env:usage_module } else { (Get-ChildItem -Directory | Where-Object { $_.Name -notlike '.*' -and (Test-Path -LiteralPath "$_/go.mod") }).Name }
if (-not $mods) { throw 'no modules found' }
foreach ($m in $mods) {
  $m = $m.Trim(".\/'".ToCharArray()); if (-not $m) { throw 'empty module name' }; "# $m"
  Push-Location -LiteralPath $m; try { govulncheck ./... } finally { Pop-Location }
}
'''

[tasks.clean]
description = "Delete dist/"
run = "if (Test-Path dist) { Remove-Item -Recurse -Force dist }"

# Plex has no download URL for the spec; it's embedded in the Redoc page as __redoc_state.
# jq -e fails on no match, so a page layout change errors instead of emptying openapi.json.
[tasks.openapi]
description = "Refresh openapi.json from the Plex docs page (needs network)"
run = '''
$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; if ($PSVersionTable.PSVersion -lt '7.4') { throw 'needs PowerShell 7.4+' }
$ProgressPreference = 'SilentlyContinue'
$page = (Invoke-WebRequest -UseBasicParsing https://developer.plex.tv/pms/).Content
$state = [regex]::Match($page, '(?m)^\s*const __redoc_state = (.*);\s*$').Groups[1].Value
try { $state | jq -en 'input | .spec.data | select(.openapi and (.paths | length) > 0)' > openapi.json.tmp }
catch { Remove-Item -ErrorAction Ignore openapi.json.tmp; throw "openapi: no spec found on developer.plex.tv/pms/ ($_)" }
Move-Item -Force openapi.json.tmp openapi.json
'''
