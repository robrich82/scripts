name: Renovate config

on:
  pull_request:
    paths: [renovate.json, .github/workflows/renovate.yml]
  push:
    branches: [main]
    paths: [renovate.json, .github/workflows/renovate.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # No file argument: a named file is validated as global, not repo, config.
      # --strict also fails on options Renovate would migrate.
      - run: npx --yes --package renovate@44.239.1 -- renovate-config-validator --strict
