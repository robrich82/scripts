name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so new govulncheck advisories surface without waiting for a PR.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      modules: ${{ steps.pick.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Every module on a schedule, a ci.yml, mise.toml or .golangci.yml change, or
      # an unknown base (new branch, force push); otherwise only modules with
      # changed files.
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          all=$(dirname */go.mod)
          if [ "$EVENT" = schedule ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            picked=$all
          else
            files=$(git diff --name-only "$BASE...$HEAD")
            if grep -qxE '\.github/workflows/ci\.yml|mise\.toml|\.golangci\.yml' <<<"$files"; then
              picked=$all
            else
              picked=$(for m in $all; do grep -q "^$m/" <<<"$files" && echo "$m"; done || true)
            fi
          fi
          echo "modules=$(printf '%s\n' $picked | jq -Rnc '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    name: ${{ matrix.module }}
    # The tools target Windows (filetime, process detection), so test there.
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.module }}
    steps:
      # Runner defaults to CRLF checkouts, which gofmt flags on every file.
      - run: git config --global core.autocrlf false
        working-directory: .

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.*

      # Linters at the versions mise.toml pins. Go stays with setup-go (go.mod's
      # version, build cache); without MISE_DISABLE_TOOLS mise refuses to build
      # the linters until its own Go is installed.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        env:
          MISE_DISABLE_TOOLS: go
        with:
          version: 2026.11.3
          install_args: >-
            golangci-lint
            go:golang.org/x/vuln/cmd/govulncheck

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: go vet (non-Windows stubs)
        run: GOOS=linux go vet ./...

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: go test
        run: go test ./...

      # A new advisory shouldn't block unrelated merges; the weekly run still goes red.
      - name: govulncheck
        run: govulncheck ./...
        continue-on-error: ${{ github.event_name != 'schedule' }}
