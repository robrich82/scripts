name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so new govulncheck advisories surface without waiting for a PR.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.pick.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Every module on a schedule, a ci.yml or mise.toml change, or an unknown
      # base (new branch, force push); otherwise only modules with changed files.
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          all=$(dirname */go.mod)
          if [ "$EVENT" = schedule ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            picked=$all
          else
            files=$(git diff --name-only "$BASE...$HEAD")
            if grep -qxE '\.github/workflows/ci\.yml|mise\.toml' <<<"$files"; then
              picked=$all
            else
              picked=$(for m in $all; do grep -q "^$m/" <<<"$files" && echo "$m"; done || true)
            fi
          fi
          echo "modules=$(printf '%s\n' $picked | jq -Rnc '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    name: ${{ matrix.module }}
    # The tools target Windows (filetime, process detection), so test there.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.module }}
    steps:
      # Runner defaults to CRLF checkouts, which gofmt flags on every file.
      - run: git config --global core.autocrlf false
        working-directory: .

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.*

      # Linters at the versions mise.toml pins. Go stays with setup-go (go.mod's
      # version, build cache); without MISE_DISABLE_TOOLS mise refuses to build
      # the linters until its own Go is installed.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        env:
          MISE_DISABLE_TOOLS: go
        with:
          version: 2026.11.0
          install_args: >-
            go:honnef.co/go/tools/cmd/staticcheck
            go:mvdan.cc/unparam
            go:golang.org/x/vuln/cmd/govulncheck

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on the files below"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go vet (non-Windows stubs)
        run: GOOS=linux go vet ./...

      - name: staticcheck
        run: staticcheck ./...

      - name: unparam
        run: unparam ./...

      - name: go test
        run: go test ./...

      - name: govulncheck
        run: govulncheck ./...
