name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so new govulncheck advisories surface without waiting for a PR.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      modules: ${{ steps.pick.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Every module on a schedule, a ci.yml, mise.toml, mise.lock or .golangci.yml change, or
      # an unknown base (new branch, force push); otherwise only modules with
      # changed files.
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          all=$(dirname */go.mod)
          if [ "$EVENT" = schedule ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            picked=$all
          else
            files=$(git diff --name-only "$BASE...$HEAD")
            if grep -qxE '\.github/workflows/ci\.yml|mise\.(toml|lock)|\.golangci\.yml' <<<"$files"; then
              picked=$all
            else
              picked=$(for m in $all; do grep -q "^$m/" <<<"$files" && echo "$m"; done || true)
            fi
          fi
          echo "modules=$(printf '%s\n' $picked | jq -Rnc '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    name: ${{ matrix.module }}
    # The tools target Windows (filetime, process detection), so test there.
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    defaults:
      run:
        shell: bash
    env:
      MODULE: ${{ matrix.module }}
      # Go comes from setup-go (go.mod's version, build cache); without this mise's go:
      # backend won't build govulncheck until mise's own Go is installed.
      # The tasks need only what mise-action installs.
      MISE_DISABLE_TOOLS: go
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      # Covers the actions' own pwsh too, not just the mise tasks'.
      POWERSHELL_TELEMETRY_OPTOUT: "1"
    steps:
      # Runner defaults to CRLF checkouts, which gofmt flags on every file.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.*

      # Caches only downloads, which mise checks against mise.lock's checksums. The
      # action's own cache restores installed tools without checking them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mise-cache/downloads-cas
          key: mise-downloads-${{ runner.os }}-${{ hashFiles('mise.lock') }}

      # Linters at the versions mise.lock pins.
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        env:
          MISE_CACHE_DIR: ${{ runner.temp }}/mise-cache
        with:
          version: 2026.11.10
          cache: false
          install_args: >-
            --locked
            golangci-lint
            go:golang.org/x/vuln/cmd/govulncheck

      # The install above checks only the tools it installs; re-enable go so this covers every pin.
      - name: mise.lock covers mise.toml
        run: mise install --locked --dry-run
        env:
          MISE_DISABLE_TOOLS: ""

      - name: vet
        run: mise run vet "$MODULE"

      - name: vet (non-Windows stubs)
        run: mise run vet-linux "$MODULE"

      - name: test
        run: mise run test "$MODULE"

      # A new advisory shouldn't block unrelated merges; the weekly run still goes red.
      - name: govulncheck
        run: mise run vuln "$MODULE"
        continue-on-error: ${{ github.event_name != 'schedule' }}
