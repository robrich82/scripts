name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so new govulncheck advisories surface without waiting for a PR.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.module }}
    # The tools target Windows (filetime, process detection), so test there.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        module: [cbz-fix, mkv-audit, mkv-movie, mkv-music, mkv-tvshow, sw-update]
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.*

      - name: Install linters
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install mvdan.cc/unparam@v0.0.0-20261011093844-7a2c2c0b7aa6
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on the files below"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go vet (non-Windows stubs)
        run: GOOS=linux go vet ./...

      - name: staticcheck
        run: staticcheck ./...

      - name: unparam
        run: unparam ./...

      - name: go test
        run: go test ./...

      - name: govulncheck
        run: govulncheck ./...
