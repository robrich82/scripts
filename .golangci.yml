version: "2"

run:
  # Queue behind a concurrent run (another worktree) instead of failing.
  allow-serial-runners: true

linters:
  default: standard
  # Off until its existing findings are fixed.
  disable:
    - errcheck
  enable:
    - unparam

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      # Plain gofmt, so the gofmt -w edit hook clears every finding.
      simplify: false
